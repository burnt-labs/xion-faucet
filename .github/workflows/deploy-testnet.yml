name: Deploy Testnet

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-testnet:
    runs-on: ubuntu-latest
    environment:
      name: testnet
      url: https://faucet.xion.burnt.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy worker to testnet
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env testnet
          packageManager: npm
