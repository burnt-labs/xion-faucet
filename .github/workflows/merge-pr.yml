name: Merge PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Seed build-time env from .env.example
        run: cp .env.example .env
      - run: npm ci
      - run: npm run build

  deploy-testnet:
    needs: check
    uses: ./.github/workflows/deploy-testnet.yml
    secrets: inherit
